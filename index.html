<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="google-site-verification" content="5612396730307003">
<title>離乳食 おかゆ計算ツール</title>
<style>
body { font-family:"Helvetica","Yu Gothic",sans-serif; margin:0; padding:20px; background:#fff7e6; color:#333;}
h1 { text-align:center; font-size:24px; background:#ffb86c; padding:10px 0; border-radius:10px; color:white; margin-bottom:20px; box-shadow:0 3px 6px rgba(0,0,0,0.15);}
.box { background:#fff; padding:20px; border-radius:12px; margin-bottom:25px; box-shadow:0 4px 10px rgba(0,0,0,0.1);}
.label { font-weight:bold; margin-top:10px;}
.tab-btns, .option-btns { display:flex; gap:5px; margin-top:5px;}
.option-btn { flex:1; padding:10px; border-radius:8px; border:1px solid #ccc; cursor:pointer; text-align:center; background:#eee;}
.option-btn.active { background:#4cc9f0; color:white; border-color:#4cc9f0;}
.result { margin-top:15px; background:#ffecc7; padding:15px; border-radius:10px; font-size:18px;}
.tabs { display:flex; margin-bottom:15px; }
.tab-btn { flex:1; padding:10px; cursor:pointer; background:#eee; text-align:center; border-radius:8px 8px 0 0; margin-right:2px;}
.tab-btn.active { background:#4cc9f0; color:white;}
.tab-content { display:none; }
.tab-content.active { display:block; }
.ad-box { margin-top:15px; text-align:center; }

/* ▼ 注意書きデザイン ▼ */
.notice {
    font-size: 12px;
    color: #666;
    padding: 10px;
    margin-top: 30px;
    text-align: center;
    line-height: 1.6;
}
</style>

<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-5612396730307003" crossorigin="anonymous"></script>
</head>
<body>

<h1>離乳食 おかゆ計算ツール</h1>

<div class="tabs">
  <div class="tab-btn active" onclick="showTab(1)">水の量計算</div>
  <div class="tab-btn" onclick="showTab(2)">米またはご飯・水の量計算</div>
</div>

<!-- タブ1 -->
<div id="tab1" class="tab-content active box">
    <div class="label">倍率</div>
    <div class="option-btns" id="rateBtns1">
        <div class="option-btn active" onclick="selectRate(1,'10倍')">10倍</div>
        <div class="option-btn" onclick="selectRate(1,'7倍')">7倍</div>
        <div class="option-btn" onclick="selectRate(1,'5倍')">5倍</div>
        <div class="option-btn" onclick="selectRate(1,'軟飯')">軟飯</div>
    </div>

    <div class="label">米 / ご飯</div>
    <div class="option-btns" id="typeBtns1">
        <div class="option-btn active" onclick="selectType(1,'米')">米</div>
        <div class="option-btn" onclick="selectType(1,'ご飯')">ご飯</div>
    </div>

    <div class="label">量（g）</div>
    <input type="number" id="amount1" placeholder="例：10">

    <div id="result1" class="result"></div>

    <div class="ad-box" id="ad1">
        <ins class="adsbygoogle" style="display:block"
             data-ad-client="ca-pub-5612396730307003"
             data-ad-slot="9598413138"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>
</div>

<!-- タブ2 -->
<div id="tab2" class="tab-content box">
    <div class="label">完成量（g）</div>
    <input type="number" id="finish" placeholder="例：100">

    <div class="label">倍率</div>
    <div class="option-btns" id="rateBtns2">
        <div class="option-btn active" onclick="selectRate(2,'10倍')">10倍</div>
        <div class="option-btn" onclick="selectRate(2,'7倍')">7倍</div>
        <div class="option-btn" onclick="selectRate(2,'5倍')">5倍</div>
        <div class="option-btn" onclick="selectRate(2,'軟飯')">軟飯</div>
    </div>

    <div class="label">米 / ご飯</div>
    <div class="option-btns" id="typeBtns2">
        <div class="option-btn active" onclick="selectType(2,'米')">米</div>
        <div class="option-btn" onclick="selectType(2,'ご飯')">ご飯</div>
    </div>

    <div id="result2" class="result"></div>

    <div class="ad-box" id="ad2">
        <ins class="adsbygoogle" style="display:block"
             data-ad-client="ca-pub-5612396730307003"
             data-ad-slot="9598413138"
             data-ad-format="auto"
             data-full-width-responsive="true"></ins>
    </div>
</div>

<!-- ▼▼ 追加した注意書き ▼▼ -->
<div class="notice">
    本ツールは、一般的に紹介されている離乳食のおかゆ比率を参考に作成しています。<br>
    医学的・専門的な助言を提供するものではありません。<br>
    実際の調理や離乳食の進め方は、お子さまの状態や医師・専門家の指導に従ってください。<br>
    本ツールを用いて生じたいかなる損害についても、制作者は一切責任を負いません。<br>
    自己責任でご利用ください。
</div>

<script>
// タブ切り替え
function showTab(n) {
    const tabs = document.getElementsByClassName("tab-content");
    const btns = document.getElementsByClassName("tab-btn");
    for(let i=0;i<tabs.length;i++){ tabs[i].classList.remove("active"); btns[i].classList.remove("active"); }
    document.getElementById("tab"+n).classList.add("active");
    btns[n-1].classList.add("active");
    (adsbygoogle = window.adsbygoogle || []).push({});
}

// ボタン選択
let selectedRate = ['10倍','10倍'];
let selectedType = ['米','米'];

function selectRate(tab, value){
    selectedRate[tab-1] = value;
    const btns = document.getElementById("rateBtns"+tab).children;
    for(let b of btns){ b.classList.remove("active"); if(b.textContent===value) b.classList.add("active"); }
    if(tab===1) calcWater(); else calcReverse();
}

function selectType(tab, value){
    selectedType[tab-1] = value;
    const btns = document.getElementById("typeBtns"+tab).children;
    for(let b of btns){ b.classList.remove("active"); if(b.textContent===value) b.classList.add("active"); }
    if(tab===1) calcWater(); else calcReverse();
}

// 水の量計算
function calcWater(){
    const amount = Number(document.getElementById("amount1").value);
    if(!amount){ document.getElementById("result1").innerHTML=""; return; }
    const rate = selectedRate[0]; const type = selectedType[0];
    let factor=0;
    if(rate==="10倍") factor=(type==="米")?10:9;
    if(rate==="7倍") factor=(type==="米")?7:6;
    if(rate==="5倍") factor=(type==="米")?5:4;
    if(rate==="軟飯") factor=(type==="米")?2:1.5;
    const water = amount*factor;
    document.getElementById("result1").innerHTML=`必要な水の量：<b>${water} g</b>`;
}

// 逆算計算
function calcReverse(){
    const finish = Number(document.getElementById("finish").value);
    if(!finish){ document.getElementById("result2").innerHTML=""; return; }
    const rate = selectedRate[1]; const type = selectedType[1];
    let totalRatio=0;
    if(rate==="10倍") totalRatio=(type==="米")?11:10;
    if(rate==="7倍") totalRatio=(type==="米")?8:7;
    if(rate==="5倍") totalRatio=(type==="米")?6:5;
    if(rate==="軟飯") totalRatio=(type==="米")?3:2.5;
    const base = finish/totalRatio; const water = finish-base;
    document.getElementById("result2").innerHTML=`必要な${type}：<b>${base.toFixed(1)} g</b><br>必要な水：<b>${water.toFixed(1)} g</b>`;
}

document.getElementById("amount1").addEventListener("input", calcWater);
document.getElementById("finish").addEventListener("input", calcReverse);
</script>

</body>
</html>
